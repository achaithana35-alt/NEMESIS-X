name: CI — Anomaly Detection Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        continue-on-error: true
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short --co -q 2>/dev/null || true
          python -m pytest tests/test_pipeline.py -v --tb=short -k "not TestObjectDetector and not TestMultiObjectTracker"

      - name: Check imports
        run: |
          python -c "from src.detector import ObjectDetector, Detection; print('✓ detector')"
          python -c "from src.tracker import MultiObjectTracker, Track; print('✓ tracker')"
          python -c "from src.anomaly_classifier import AnomalyClassifier, UCF_CRIME_CLASSES; print('✓ classifier')"
          python -c "from src.utils import FPSCounter, LatencyTracker, load_config; print('✓ utils')"
          python -c "from src.heatmap import draw_detections, generate_anomaly_heatmap; print('✓ heatmap')"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff

      - name: Run Ruff linter
        run: |
          ruff check src evaluation optimization --ignore E501 || true
