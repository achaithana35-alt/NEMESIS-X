# ============================================================
# ByteTrack Tracker Configuration
# ============================================================
# Reference: https://github.com/ifzhang/ByteTrack

tracker_type: bytetrack

# ── Association thresholds ────────────────────────────────
track_high_thresh: 0.25        # Retain low-confidence detections in sampled summaries
track_low_thresh: 0.1          # Detection confidence threshold for second association
new_track_thresh: 0.25         # Match the analyzer's default detection threshold
match_thresh: 0.8              # IoU matching threshold

# ── Track lifecycle ──────────────────────────────────────
track_buffer: 30               # Frames to keep lost tracks alive
fuse_score: true               # Fuse detection confidence into IoU cost
