# ============================================================
# Inference Optimization Configuration
# ============================================================

# ── ONNX Export ───────────────────────────────────────────
onnx:
  opset: 17                          # ONNX opset version
  simplify: true                     # Run onnx-simplifier
  dynamic: false                     # Dynamic input shapes
  input_shape: [1, 3, 640, 640]      # Static input shape [B, C, H, W]

# ── TensorRT ──────────────────────────────────────────────
tensorrt:
  precision: "fp16"                  # "fp32" | "fp16" | "int8"
  workspace_size: 4                  # Max workspace size in GB
  calibration_images: 500            # Number of images for INT8 calibration
  calibration_cache: "weights/calibration.cache"

# ── Quantization ─────────────────────────────────────────
quantization:
  method: "dynamic"                  # "dynamic" | "static" | "qat"
  calibration_dataset: "data/calibration/"
  num_calibration_batches: 100

# ── Benchmark ────────────────────────────────────────────
benchmark:
  warmup_iterations: 50
  benchmark_iterations: 200
  input_shape: [1, 3, 640, 640]
  backends: ["pytorch", "onnx"]      # Add "tensorrt" if TRT available
  output_file: "results/benchmark_table.md"
